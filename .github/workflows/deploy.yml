name: React CI/CD to S3 with CDN

on:
  push:
    branches:
      - dev
      - qa

env:
  S3_BUCKET_DEV: your-dev-bucket
  S3_BUCKET_QA: your-qa-bucket
  CLOUDFRONT_DEV: your-dev-dist-id
  CLOUDFRONT_QA: your-qa-dist-id

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Cache node modules
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

    - name: Install Dependencies
      run: npm install

    # 🔥 React Build (IMPORTANT CHANGE)
    - name: Build React App
      run: npm run build

    # 🔹 Dynamic Env Selection
    - name: Set Environment (Bucket + CDN)
      run: |
        if [[ "${GITHUB_REF##*/}" == "dev" ]]; then
          echo "BUCKET=${{ env.S3_BUCKET_DEV }}" >> $GITHUB_ENV
          echo "DIST_ID=${{ env.CLOUDFRONT_DEV }}" >> $GITHUB_ENV
        else
          echo "BUCKET=${{ env.S3_BUCKET_QA }}" >> $GITHUB_ENV
          echo "DIST_ID=${{ env.CLOUDFRONT_QA }}" >> $GITHUB_ENV
        fi

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    # 🔹 Deploy React build
    - name: Deploy to S3
      run: |
        aws s3 sync build/ s3://$BUCKET \
        --delete \
        --exclude "index.html"

    # 🔹 SPA Fix (VERY IMPORTANT)
    - name: Upload index.html (No Cache)
      run: |
        aws s3 cp build/index.html s3://$BUCKET/index.html \
        --cache-control "no-cache"

    # 🔥 CDN STEP
    - name: Invalidate CloudFront Cache
      run: |
        aws cloudfront create-invalidation \
        --distribution-id $DIST_ID \
        --paths "/*"

    # 🔹 Artifact (optional)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: react-build
        path: build/